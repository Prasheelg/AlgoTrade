# AlgoTrade power switch (see src/index.js). Deploy: npx wrangler deploy (after npx wrangler login, once)
name = "algotrade-power"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [{ pattern = "algo.trendywork.in/*", zone_name = "trendywork.in" }]

[vars]
REGION = "ap-south-1"
SERVER_NAME = "AlgoTrade"   # the server is the instance with this Name tag
# Secrets (npx wrangler secret put <name>): AWS_KEY_ID, AWS_SECRET of the IAM user algotrade-power
